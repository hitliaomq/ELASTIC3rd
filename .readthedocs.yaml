# Read the Docs configuration file for ELASTIC3rd
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

python:
  install:
    # Docs build dependencies (the Read the Docs theme).
    - requirements: docs/requirements.txt
    # Install the package itself so its modules are importable during the build.
    - method: pip
      path: .
